<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bar Down Jones - Simulador de Bolsa</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>
<body>
    <div class="container">
        <h1>Bar Down Jones</h1>
        <div class="controls">
            <label><input type="checkbox" id="sound-toggle"> Activar sonido</label>
            <button id="theme-toggle">Cambiar Tema</button>
            <button id="mode-toggle">Modo Solo Bebidas</button>
            <button id="fullscreen-toggle">Pantalla Completa</button>
            <button id="ticker-toggle">Pausar Ticker</button>
            <button id="export-history">Exportar Historial</button>
        </div>
        <div class="index">
            <h2>Índice Down Jones: <span id="index-value">1000</span></h2>
            <canvas id="index-chart" width="200" height="100"></canvas>
            <p>Próximo Crash: <span id="crash-timer">5:00</span></p>
        </div>
        <div class="drinks">
            <h2>Bebidas Disponibles</h2>
            <div class="categories">
                <div class="category">
                    <h3>Cócteles</h3>
                    <ul id="cocktails-list" class="drinks-list"></ul>
                </div>
                <div class="category">
                    <h3>Cervezas</h3>
                    <ul id="beers-list" class="drinks-list"></ul>
                </div>
                <div class="category">
                    <h3>Sin Alcohol</h3>
                    <ul id="non-alcoholic-list" class="drinks-list"></ul>
                </div>
            </div>
        </div>
        <div class="bottom-section">
            <div class="cart">
                <h2>Tu Pedido</h2>
                <ul id="cart-items"></ul>
                <p>Total: €<span id="cart-total">0</span></p>
                <button id="buy-button">Comprar</button>
            </div>
            <div class="history">
                <h2>Historial de Transacciones</h2>
                <ul id="history-list"></ul>
            </div>
        </div>
        <div class="ticker">
            <div id="ticker-content"></div>
        </div>
        <div id="notifications"></div>
    </div>
    <audio id="crash-sound" src="crash.mp3"></audio>
    <audio id="offer-sound" src="offer.mp3"></audio>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(() => console.log('Service Worker registrado'))
                .catch(err => console.error('Service Worker error:', err));
        }
    </script>
    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js';
        import { getDatabase, ref, set } from 'https://www.gstatic.com/firebasejs/11.6.0/firebase-database.js';
        const firebaseConfig = {
            apiKey: "AIzaSyAV9R90-9wiGI6TUdxf3rJKer8ul_UnPP4",
            authDomain: "downjone-sync.firebaseapp.com",
            databaseURL: "https://downjone-sync-default-rtdb.firebaseio.com",
            projectId: "downjone-sync",
            storageBucket: "downjone-sync.firebasestorage.app",
            messagingSenderId: "306426085063",
            appId: "1:306426085063:web:cb646bf57d450b22a408e2"
        };
        const app = initializeApp(firebaseConfig);
        window.db = getDatabase(app);
        console.log('Firebase inicializado');
        // Inicializar Firebase con datos por defecto
        const initialState = {
            drinks: [
                { id: 1, name: "Mojito", price: 8, prevPrice: 8, discount: false, popularity: 0, discountEnd: 0 },
                { id: 2, name: "Caipirinha", price: 7, prevPrice: 7, discount: false, popularity: 0, discountEnd: 0 },
                { id: 3, name: "Gin Tonic", price: 9, prevPrice: 9, discount: false, popularity: 0, discountEnd: 0 },
                { id: 4, name: "Margarita", price: 8, prevPrice: 8, discount: false, popularity: 0, discountEnd: 0 },
                { id: 5, name: "Negroni", price: 10, prevPrice: 10, discount: false, popularity: 0, discountEnd: 0 },
                { id: 6, name: "Old Fashioned", price: 11, prevPrice: 11, discount: false, popularity: 0, discountEnd: 0 },
                { id: 7, name: "Daiquiri", price: 8.5, prevPrice: 8.5, discount: false, popularity: 0, discountEnd: 0 },
                { id: 8, name: "Cerveza Artesanal", price: 5, prevPrice: 5, discount: false, popularity: 0, discountEnd: 0 },
                { id: 9, name: "IPA", price: 6, prevPrice: 6, discount: false, popularity: 0, discountEnd: 0 },

                { id: 11, name: "Stout", price: 6.5, prevPrice: 6.5, discount: false, popularity: 0, discountEnd: 0 },

        set(ref(window.db, 'state'), initialState)
            .then(() => console.log('Firebase inicializado con estado por defecto'))
            .catch(err => console.error('Firebase init error:', err));
    </script>
    <script src="script.js"></script>
</body>
</html>
